name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/idealo_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/idealo_ci
      AUTH_SECRET: valor-solo-para-compilar-en-ci
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_NAME: Idealo
      # No son credenciales reales: la base de este job es descartable, vive
      # solo mientras dura el workflow. Se usan para sembrar la usuaria admin
      # y para que el recorrido de administración de Playwright pueda loguearse.
      SEED_ADMIN_EMAIL: ci-admin@example.com
      SEED_ADMIN_PASSWORD: CIPassword123!

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: idealo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Formato
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Verificación de tipos
        run: npm run typecheck

      - name: Pruebas unitarias (con cobertura)
        run: npm run test:coverage

      # Migrar y sembrar antes del build: la portada (/) se prerrenderiza en
      # build time y lee SiteSetting real (hero, contacto, quiénes somos) —
      # sin esos tres registros el build falla, no solo el recorrido E2E.
      - name: Migrar la base de datos
        run: npx prisma migrate deploy

      - name: Sembrar datos de referencia
        run: npm run db:seed

      - name: Compilación
        run: npm run build

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Pruebas end-to-end
        run: npm run test:e2e

      - name: Subir reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
